<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | cornpip</title>
    <meta
      name="description"
      content="Portfolio page featuring Seonhyo Choi's profile and project archive"
    />
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-grain" aria-hidden="true"></div>
    <div class="page-glow page-glow-1" aria-hidden="true"></div>
    <div class="page-glow page-glow-2" aria-hidden="true"></div>

    <header class="hero container reveal">
      <div class="hero-rule" aria-hidden="true"></div>
      <h1 id="heroTitle"></h1>
      <div class="hero-actions">
        <a href="#projects" class="btn btn-primary" id="heroProjectsLink"></a>
        <a href="#contact" class="btn btn-ghost" id="heroContactLink"></a>
      </div>
    </header>

    <main class="container">
      <div class="page-layout">
        <div class="page-content">
          <section id="about" class="panel reveal">
            <h2 id="aboutHeading"></h2>
            <div class="about-layout">
              <figure class="profile-card">
                <img
                  src="assets/profile/profile.jpg"
                  alt="Profile photo of Seonhyo Choi"
                  id="profileImage"
                  class="profile-image"
                  onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
                />
                <div class="profile-placeholder" style="display: none" aria-hidden="true">PHOTO</div>
                <figcaption>
                  <strong id="profileName"></strong>
                  <span id="profileRole"></span>
                </figcaption>
              </figure>

              <div class="about-content">
                <p class="hero-lead" id="heroLead"></p>
                <div class="hero-description" id="heroDescription"></div>
                <p id="aboutDescription"></p>
                <ul class="about-list" id="aboutList"></ul>
                <div class="hero-highlights" id="heroHighlights"></div>
              </div>
            </div>
          </section>

          <section id="projects" class="reveal">
            <div class="section-heading">
              <h2 id="projectsHeading"></h2>
              <p class="section-copy" id="projectsIntro"></p>
            </div>
            <div class="timeline" id="projectsTimeline"></div>
          </section>

          <section id="contact" class="panel reveal">
            <h2 id="contactHeading"></h2>
            <p id="contactDescription"></p>
            <div class="contact-grid">
              <a href="https://github.com/cornpip" target="_blank" rel="noreferrer">
                <svg class="contact-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path
                    fill="currentColor"
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                  />
                </svg>
                GitHub</a
              >
              <a href="https://www.linkedin.com/in/seonhyo-choi-62a48a263" target="_blank" rel="noreferrer">
                <svg class="contact-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path
                    fill="currentColor"
                    d="M14.82 0H1.18A1.17 1.17 0 0 0 0 1.15v13.7A1.17 1.17 0 0 0 1.18 16h13.64A1.17 1.17 0 0 0 16 14.85V1.15A1.17 1.17 0 0 0 14.82 0ZM4.74 13.63H2.37V6h2.37ZM3.56 4.96a1.38 1.38 0 1 1 0-2.75 1.38 1.38 0 0 1 0 2.75Zm10.07 8.67h-2.37V9.92c0-.89-.02-2.03-1.24-2.03-1.24 0-1.43.97-1.43 1.96v3.78H6.22V6H8.5v1.04h.03a2.5 2.5 0 0 1 2.25-1.23c2.4 0 2.85 1.58 2.85 3.64Z"
                  />
                </svg>
                LinkedIn</a
              >
              <a href="https://cornpip.dev/en/" target="_blank" rel="noreferrer">
                <svg class="contact-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path
                    fill="currentColor"
                    d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm5.9 5h-2.33a10.6 10.6 0 0 0-1.2-3.13A6.53 6.53 0 0 1 13.9 5ZM8 1.5c.67.83 1.29 2.04 1.66 3.5H6.34C6.71 3.54 7.33 2.33 8 1.5ZM1.7 9.5a6.56 6.56 0 0 1 0-3h2.6a13.6 13.6 0 0 0 0 3Zm.4 1.5h2.33c.29 1.2.71 2.27 1.2 3.13A6.53 6.53 0 0 1 2.1 11Zm2.33-6H2.1a6.53 6.53 0 0 1 3.53-3.13c-.49.86-.91 1.93-1.2 3.13ZM8 14.5c-.67-.83-1.29-2.04-1.66-3.5h3.32c-.37 1.46-.99 2.67-1.66 3.5Zm1.94-5H6.06a12 12 0 0 1 0-3h3.88a12 12 0 0 1 0 3Zm.43 4.63c.49-.86.91-1.93 1.2-3.13h2.33a6.53 6.53 0 0 1-3.53 3.13Zm1.33-4.63a13.6 13.6 0 0 0 0-3h2.6a6.56 6.56 0 0 1 0 3Z"
                  />
                </svg>
                Blog</a
              >
            </div>
          </section>
        </div>

        <aside class="page-index" aria-label="Archive index">
          <div class="page-index-inner">
            <p class="page-index-title" id="archiveIndexTitle"></p>
            <nav class="archive-nav" id="archiveNav"></nav>
          </div>
        </aside>
      </div>
    </main>

    <footer class="container footer">
      <p id="footerText"></p>
    </footer>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">×</button>
      <button class="lightbox-nav prev" id="lightboxPrev" type="button" aria-label="Previous image">‹</button>
      <figure class="lightbox-figure">
        <img id="lightboxImage" alt="Expanded project image" />
        <figcaption class="lightbox-indicator" id="lightboxIndicator">1 / 1</figcaption>
      </figure>
      <button class="lightbox-nav next" id="lightboxNext" type="button" aria-label="Next image">›</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
